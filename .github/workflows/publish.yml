name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  # Required for npm trusted publishing (OIDC). No NPM_TOKEN secret is used.
  id-token: write

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted-publisher OIDC support
        run: npm install -g npm@latest

      - run: npm ci

      - name: Verify the release tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
